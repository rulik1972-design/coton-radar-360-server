services:
  - type: web
    name: coton-radar-360-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DEVICE_KEY
        sync: false
      - key: VIEW_USER
        value: radar
      - key: VIEW_PASSWORD
        sync: false
